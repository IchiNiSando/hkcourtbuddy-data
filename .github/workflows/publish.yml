name: publish-feed

on:
  schedule:
    # Every 15 min from 07:00 to 23:45 HKT (= 23:00-15:45 UTC). Each run also sleeps a random
    # 20-40 s before fetching so the request times never form a fixed pattern.
    - cron: "*/15 23 * * *"
    - cron: "*/15 0-15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - run: pip install -r fetcher/requirements.txt

      - name: Connect HK WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          if [ -z "$WG_CONFIG" ]; then echo "no WG_CONFIG secret, fetching directly"; exit 0; fi
          sudo apt-get install -y wireguard-tools resolvconf
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Random jitter (20-40 s)
        if: github.event_name == 'schedule'
        run: sleep $((20 + RANDOM % 21))

      - name: Fetch availability
        env:
          FEED_SALT: ${{ secrets.FEED_SALT }}
        run: python fetcher/fetch.py --enc feed.bin

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Publish data branch
        run: |
          mkdir /tmp/pub && cp feed.bin /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add feed.bin
          git commit -qm "feed $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
