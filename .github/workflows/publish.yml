name: publish-feed

# GitHub's cron is unreliable on its own (it skipped nearly every slot on this repo), so each
# run re-dispatches the next one after it, 24/7. The cron is only a backup restart.
on:
  schedule:
    - cron: "4 * * * *"               # backup restart (skipped if a run is active)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30               # a run sleeps until T0 + 10 min; retries can overrun it
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard (cron restart only if no other run is active)
        id: guard
        run: |
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            others=$(gh run list -R "${{ github.repository }}" --workflow publish.yml --status in_progress --json databaseId -q '.[].databaseId' | grep -vx "${{ github.run_id }}" | wc -l)
            if [ "$others" -gt 0 ]; then echo "chain is alive, skipping cron start"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - run: pip install -r fetcher/requirements.txt
        if: steps.guard.outputs.skip != '1'

      - name: Connect HK WireGuard
        if: steps.guard.outputs.skip != '1'
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          if [ -z "$WG_CONFIG" ]; then echo "no WG_CONFIG secret, fetching directly"; exit 0; fi
          sudo apt-get install -y wireguard-tools resolvconf
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Random jitter (20-40 s)
        if: steps.guard.outputs.skip != '1'
        run: sleep $((20 + RANDOM % 21))

      # Up to 3 attempts, a minute apart: a transient SmartPLAY/VPN hiccup shouldn't cost an hour.
      # PREV_FEED_URL lets the fetcher keep the previous values for any sport/date that still fails.
      - name: Fetch availability
        id: fetch
        if: steps.guard.outputs.skip != '1'
        env:
          FEED_SALT: ${{ secrets.FEED_SALT }}
          PREV_FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/feed.bin
        run: |
          for attempt in 1 2 3; do
            if python fetcher/fetch.py --enc feed.bin; then exit 0; fi
            echo "fetch attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1

      - name: Disconnect VPN
        if: always() && steps.guard.outputs.skip != '1'
        run: sudo wg-quick down wg0 || true

      - name: Publish data branch
        if: steps.guard.outputs.skip != '1'
        run: |
          mkdir /tmp/pub && cp feed.bin /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add feed.bin
          git commit -qm "feed $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Chain next run (every 10 min; 5 min after a failed fetch)
        if: always() && steps.guard.outputs.skip != '1'
        run: |
          gap=600
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then gap=300; fi
          next=$((T0 + gap))
          now=$(date +%s); [ "$next" -gt "$now" ] && sleep $((next - now))
          gh workflow run publish.yml -R "${{ github.repository }}"
